name: Build

on: push

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.21-alpine
    steps:
      - uses: actions/checkout@v6
      - name: Set shards version from current commit
        run: |
          # Prepare
          git config --global --add safe.directory /__w/Ingraham/Ingraham

          # Get the 7-character short commit SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Read the base version from shard.yml
          BASE_VERSION=$(grep -E '^version:' shard.yml | awk '{print $2}')
          
          # Construct the new version string
          NEW_VERSION="${BASE_VERSION}+git.commit.${SHORT_SHA}"
          
          # Update shard.yml
          sed -i "s/^version:.*/version: ${NEW_VERSION}/" shard.yml
      - name: Build and package
        run: |
          mkdir -p bin
          shards install
          shards build --release --static --no-debug
          mv bin/ingraham bin/ingraham-linux-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: ingraham-linux-amd64
          path: bin/ingraham-linux-amd64
          if-no-files-found: error
  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: crystal-lang/install-crystal@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set shards version from current commit
        run: |
          # Prepare
          git config --global --add safe.directory /__w/Ingraham/Ingraham

          # Get the 7-character short commit SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Read the base version from shard.yml
          BASE_VERSION=$(grep -E '^version:' shard.yml | awk '{print $2}')
          
          # Construct the new version string
          NEW_VERSION="${BASE_VERSION}+git.commit.${SHORT_SHA}"
          
          # Update shard.yml
          sed -i "s/^version:.*/version: ${NEW_VERSION}/" shard.yml
      - name: Build and package
        run: |
          shards install
          shards build --release --static --no-debug
          Rename-Item -Path bin/ingraham.exe -NewName ingraham-windows-amd64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ingraham-windows-amd64
          path: bin/ingraham-windows-amd64.exe
          if-no-files-found: error