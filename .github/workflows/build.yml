name: Build

on: push

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v6
      - uses: crystal-lang/install-crystal@v1
      - name: Build and package
        run: |
          mkdir -p bin
          shards build --release --static --no-debug
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: bin/ingraham-linux-amd64
          if-no-files-found: error
  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: crystal-lang/install-crystal@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and package
        run: |
          shards build --release --static --no-debug
          Rename-Item -Path bin/ingraham.exe -NewName ingraham-windows-amd64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: bin/ingraham-windows-amd64.exe
          if-no-files-found: error